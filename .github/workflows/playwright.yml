name: Integração automática Xray

on:
  push:
    branches:
      - main
      - feature/xray-automation
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EMAIL_LOGIN: ${{ secrets.EMAIL_LOGIN }}
      PASSWORD_LOGIN: ${{ secrets.PASSWORD_LOGIN }}

      MAILHOG_USER: ${{ secrets.MAILHOG_USER }}
      MAILHOG_PASSWORD: ${{ secrets.MAILHOG_PASSWORD }}

      XRAY_CLIENT_ID_TEST_NOVO: ${{ secrets.XRAY_CLIENT_ID_TEST_NOVO }}
      XRAY_CLIENT_SECRET_TEST_NOVO: ${{ secrets.XRAY_CLIENT_SECRET_TEST_NOVO }}

    steps:
      - name: Checkout projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Instalar browsers Playwright
        run: npx playwright install --with-deps

      - name: Criar pastas reports
        run: |
          mkdir -p reports
          mkdir -p reports/screenshots
          mkdir -p reports/videos
          mkdir -p reports/html-report
          mkdir -p screenshots
      
      - name: Validar variáveis ambiente
        shell: bash
        run: |
          echo "EMAIL_LOGIN: ${EMAIL_LOGIN:+OK}"
          echo "PASSWORD_LOGIN: ${PASSWORD_LOGIN:+OK}"
          echo "MAILHOG_USER: ${MAILHOG_USER:+OK}"
          echo "MAILHOG_PASSWORD: ${MAILHOG_PASSWORD:+OK}"
          echo "XRAY_CLIENT_ID_TEST_NOVO: ${XRAY_CLIENT_ID_TEST_NOVO:+OK}"
          echo "XRAY_CLIENT_SECRET_TEST_NOVO: ${XRAY_CLIENT_SECRET_TEST_NOVO:+OK}"
      
      - name: Diagnóstico dos Secrets
        run: |
          echo "========== DIAGNÓSTICO =========="
          echo "EMAIL_LOGIN definido? $([ -n "$EMAIL_LOGIN" ] && echo SIM || echo NAO)"
          echo "PASSWORD_LOGIN definido? $([ -n "$PASSWORD_LOGIN" ] && echo SIM || echo NAO)"
          echo "MAILHOG_USER definido? $([ -n "$MAILHOG_USER" ] && echo SIM || echo NAO)"
          echo "MAILHOG_PASSWORD definido? $([ -n "$MAILHOG_PASSWORD" ] && echo SIM || echo NAO)"
          echo "XRAY_CLIENT_ID_TEST_NOVO definido? $([ -n "$XRAY_CLIENT_ID_TEST_NOVO" ] && echo SIM || echo NAO)"
          echo "XRAY_CLIENT_SECRET_TEST_NOVO definido? $([ -n "$XRAY_CLIENT_SECRET_TEST_NOVO" ] && echo SIM || echo NAO)"
          echo "================================"
      
      - name: Executar testes cadastro
        run: npm run test:cadastro

      - name: Publicar resultado no Xray
        if: always()
        run: npx ts-node scripts/xray/publishCucumberReportToXray.ts

      - name: Gerar HTML Report
        if: always()
        run: node scripts/generate-report.js

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html-report

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            reports/screenshots
            screenshots

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: reports/videos